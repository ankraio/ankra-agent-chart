name: Release Chart

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package Helm Chart
        id: package
        run: |
          set -euo pipefail
          mkdir -p /tmp/chart-packages
          helm package chart/ -d /tmp/chart-packages
          chart_package="$(ls /tmp/chart-packages/*.tgz)"
          echo "chart_package=${chart_package}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" \
            /tmp/chart-packages/*.tgz \
            --title "Release $TAG_NAME" \
            --notes "Release $TAG_NAME of ankra-agent Helm chart"

      - name: Update Helm Repository Index
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          git checkout main
          cp /tmp/chart-packages/*.tgz .
          if [[ -f index.yaml ]]; then
            helm repo index . \
              --url "https://github.com/ankraio/ankra-agent-chart/releases/download/${TAG_NAME}" \
              --merge index.yaml
          else
            helm repo index . \
              --url "https://github.com/ankraio/ankra-agent-chart/releases/download/${TAG_NAME}"
          fi
          rm -f *.tgz
          git add index.yaml
          # No [skip ci]: this push must trigger the Deploy GitHub Pages
          # workflow, which serves index.yaml to Artifact Hub. Nothing else
          # triggers on an index.yaml-only push, so there is no loop.
          git commit -m "chore: update Helm repository index for ${TAG_NAME}"
          git push origin main
